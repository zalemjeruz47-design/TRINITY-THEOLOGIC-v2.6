<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KERYX - El Heraldo</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:20px}
h1{color:#f5c542;text-align:center}
textarea{width:100%;height:80px;border-radius:10px;padding:10px;font-size:16px}
button{width:100%;padding:15px;background:#f5c542;border:none;border-radius:10px;font-size:18px;font-weight:bold;margin-top:10px}
#respuesta{background:#1a1a1a;padding:15px;border-radius:10px;margin-top:15px;white-space:pre-wrap;line-height:1.6}
</style>
</head>
<body>
<h1>KERYX - El Heraldo</h1>
<p style="text-align:center">Preguntame por una tesis bíblica</p>
<textarea id="pregunta" placeholder="Ej: Dame una tesis completa del libro de Job"></textarea>
<button onclick="responder()">Preguntar a KERYX</button>
<div id="respuesta">Aquí aparecerá la respuesta...</div>
<script>
function responder(){
  const p = document.getElementById('pregunta').value.toLowerCase();
  const r = document.getElementById('respuesta');
  if(p.includes('job')){
    r.innerText = `TESIS COMPLETA DEL LIBRO DE JOB

1. PREGUNTA CENTRAL
¿Por qué sufre el justo si Dios es bueno y justo?

2. TESIS PRINCIPAL
El Libro de Job enseña que el sufrimiento no siempre es castigo por pecado. Dios permite la prueba para revelar Su soberanía, purificar la fe y llevar al creyente a conocer a Dios no solo de oídas, sino por experiencia.

3. DESARROLLO COMPLETO
- Contexto: Job era íntegro, temeroso de Dios y apartado del mal. Satanás lo acusa de servir a Dios por interés.
- Problema: Job pierde hijos, bienes y salud en un solo día. Su fe es probada al límite.
- Error de los amigos: Elifaz, Bildad y Zofar repiten la teología de la retribución: "si sufres, es porque pecaste". Job los confronta porque sabe que es inocente.
- Respuesta de Dios: Dios no le explica el porqué, le muestra el QUIÉN. Desde el torbellino le revela Su creación, Su poder y Su sabiduría. Job entiende que Dios es suficiente.
- Conclusión: Job se arrepiente, ora por sus amigos y Dios lo restaura al doble.

4. APLICACIÓN PARA HOY
Cuando sufras sin entender, no busques siempre una culpa. Busca a Dios. La fe madura no es entender todo, es confiar en Aquel que lo gobierna todo.`;
  } else {
    r.innerText = "Soy KERYX, El Heraldo. Preguntame por ejemplo: 'Dame una tesis completa del libro de Job' y te daré la tesis completa con pregunta central, desarrollo y aplicación para hoy.";
  }
}
</script>
</body>
</html>
