Génesis 3 ocurre en el Edén, después de una creación perfecta donde todo era bueno en gran manera. El autor, Moisés, escribe para un pueblo que sale de Egipto, para enseñarles de dónde viene el pecado, el dolor y la muerte, y por qué necesitan un Salvador. No es un mito, es historia teológica real.

La palabra serpiente en hebreo es NACHASH, que significa astuto, brillante, que susurra. No era una serpiente común, era el instrumento de Satanás. Apocalipsis 12:9 la identifica como la serpiente antigua, el diablo.

El pecado entró al mundo no porque Dios falló, sino porque el hombre dudó de la bondad de Dios, deseó ser independiente de Él y desobedeció Su Palabra. Pero en el mismo capítulo donde entra el pecado, Dios ya promete la salvación.

La palabra Cordero aparece 28 veces. Es el centro del libro. Cristo es el Cordero que fue inmolado y venció.
